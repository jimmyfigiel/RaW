<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#e5e7eb" />
  <title>Roll and Write PWA</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-frame">
      <header class="top-panel">
        <div class="dice-row" id="diceRow"></div>

        <div class="tool-row">
          <button class="tool-button active" id="toolNumber" type="button">123</button>
          <button class="tool-button" id="toolDot" type="button">Dot</button>
          <button class="tool-button" id="toolCircle" type="button">O/X</button>
          <button class="tool-button secondary" id="undoButton" type="button">Undo</button>
          <button class="tool-button secondary" id="rollAllButton" type="button">Roll All</button>
        </div>

        <div class="pdf-controls">
          <label class="file-button" for="pdfInput">Load PDF</label>
          <input id="pdfInput" type="file" accept="application/pdf" />

          <button class="zoom-button" id="zoomOutButton" type="button">-</button>
          <div class="zoom-label" id="zoomLabel">100%</div>
          <button class="zoom-button" id="zoomInButton" type="button">+</button>
        </div>
      </header>

      <main class="bottom-panel" id="bottomPanel">
        <div class="pdf-note" id="pdfNote">
          Load a PDF to begin. The toolbar stays pinned at the top while the PDF scrolls below.
        </div>

        <div class="pdf-viewer" id="pdfViewer">
          <div class="empty-state" id="emptyState">
            <div class="empty-card">
              <div class="empty-title">No PDF loaded yet</div>
              <div class="empty-text">
                Tap <strong>Load PDF</strong> above, choose a PDF from your phone, then tap the pages to place marks.
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="numberPadBackdrop">
    <div class="number-pad">
      <div class="number-pad-header">
        <div class="number-pad-title">Pick a number</div>
        <button class="close-button" id="closePadButton" type="button">Close</button>
      </div>
      <div class="number-grid" id="numberGrid"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
