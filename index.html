<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#e5e7eb" />
  <title>Roll and Write PWA</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="app-frame">
      <header class="top-panel">
        <div class="dice-row" id="diceRow"></div>

        <div class="tool-row">
          <button class="tool-button active" id="toolNumber" type="button">123</button>
          <button class="tool-button" id="toolDot" type="button">Dot</button>
          <button class="tool-button" id="toolCircle" type="button">O/X</button>
          <button class="tool-button secondary" id="undoButton" type="button">Undo</button>
          <button class="tool-button secondary" id="rollAllButton" type="button">Roll All</button>
        </div>
      </header>

      <main class="bottom-panel">
        <div class="board-note">
          Testing preview sheet. This version is static and GitHub Pages friendly.
        </div>

        <div class="sheet-card">
          <div class="board-wrap">
            <div class="board" id="board">
              <svg
                class="sheet-svg"
                viewBox="0 0 900 1300"
                preserveAspectRatio="none"
                aria-hidden="true"
              >
                <rect x="0" y="0" width="900" height="1300" fill="white"></rect>

                <text x="450" y="74" text-anchor="middle" class="sheet-title">
                  Sample Roll-and-Write Sheet
                </text>

                <g class="sheet-grid">
                  <!-- dice boxes -->
                  <rect x="70" y="120" width="95" height="95" rx="14"></rect>
                  <rect x="195" y="120" width="95" height="95" rx="14"></rect>
                  <rect x="320" y="120" width="95" height="95" rx="14"></rect>
                  <rect x="445" y="120" width="95" height="95" rx="14"></rect>
                  <rect x="570" y="120" width="95" height="95" rx="14"></rect>
                  <rect x="695" y="120" width="95" height="95" rx="14"></rect>

                  <!-- circles grid -->
                  <g>
                    <script type="application/json" id="gridData">
                      {"rows":10,"cols":6,"startX":70,"startY":280,"stepX":125,"stepY":85,"size":60}
                    </script>
                  </g>
                </g>

                <text x="70" y="255" class="sheet-help">
                  Use this sample page to test dots, numbers, circles, and X marks.
                </text>
                <text x="70" y="1110" class="sheet-help">
                  Once you like the look, this can be swapped to the real PDF version.
                </text>
                <text x="70" y="1145" class="sheet-help">
                  The deployed app keeps local progress on this device.
                </text>
              </svg>

              <div class="annotation-layer" id="annotationLayer"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="numberPadBackdrop">
    <div class="number-pad">
      <div class="number-pad-header">
        <div class="number-pad-title">Pick a number</div>
        <button class="close-button" id="closePadButton" type="button">Close</button>
      </div>
      <div class="number-grid" id="numberGrid"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
